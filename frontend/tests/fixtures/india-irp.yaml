  /eicore/v1.03/Invoice/Cancel:
    post:
      summary: Cancel IRN
      tags:
        - Core E-invoice
      description: >-
        To Cancel IRN.
        <h3>Below are the validation<h3>
        1. IRN can be cancelled within 1 calendar day from IRN generation date<br> For example: If e-invoice is registered on 11th July at 10 am, it should be deleted on 12th July midnight.<br>
        2.IRN cannot be cancelled, if the Valid/Active E-way Bill exists for the same.<br>
        3.Cancellation can be done by active or suspended taxpayers.
      parameters:
        - $ref: '#/components/parameters/client_id'
        - $ref: '#/components/parameters/client_secret'
        - $ref: '#/components/parameters/gstin1'
        - $ref: '#/components/parameters/user_name'
        - $ref: '#/components/parameters/AuthToken'
        - $ref: '#/components/parameters/sup_gstin'
      
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Data:
                  type: string
            examples:
              
              'Encrypted Request':
                value: >-
                  {
                          "Data": "cwMtQmlx/upJuEqKfTMTQ6RH1s6SOQwm9SknTMBvHm9CFeJCCs4otZZbdf76sP/xpR4K3H5qvf1FmSrIFw1kmcPG1fSrE+AhZXjicr07dFsFmngugxwcTu 4BScdA75FgIolVbvDnDgvzJyg9mDWxMIM3Mkbtt7by5XC9CqVqqhnPSri9R5UE3PJgVKcMsM3aBewBdNGiQ/2Z9fITZwCp1l/z6h6pMDd93GT30I8nxMsn3"
                  }
              'JSON corresponds to the "Data" element of Cancel E-Invoice Request above':
                value: >-
                  {
                  "Irn":"a5c12dca80e743321740b001fd70953e8738d109865d28ba4013750f2046f229",
                  "CnlRsn":"1 ",
                  "CnlRem":"Wrong entry"
                  }
              
              
      responses:
        '200':
          description: API Processed Successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: number
                  Data: {}
                  ErrorDetails:
                    type: array
                    items:
                      type: object
                      properties:
                        ErrorCode:
                          type: string
                        ErrorMessage:
                          type: string
                  InfoDtls: {}
              examples:
                'Success Response':
                  value: >-
                   {
                    "status":1,
                    "data":"<Encrypted response>",
                    "ErrorDetails":null,
                    "InfoDtls":"<alert message >"
                    }
                    
                'JSON (corresponds to the data element of Cancelled e-Invoice Response(Success))':
                  value: >-
                    {   
                    "Irn":"a5c12dca80e743321740b001fd70953e8738d109865d28ba4013750f2046f229",
                    "CancelDate": "2019-12-05 14:26:00"
                    }
                    
                'Failure Response-1':
                  value: >-
                    {"Status":0,"Data":null,"ErrorDetails":[{"ErrorCode":"1006","ErrorMessage":"Header
                    User Name is required"}],"InfoDtls":null}
                    
                'Failure Response-2':
                  value: >-
                    {"Status":0,"Data":null,"ErrorDetails":[{"ErrorCode":"1010","ErrorMessage":"Invalid
                    Client-ID/Client-Secret"}],"InfoDtls":null}
