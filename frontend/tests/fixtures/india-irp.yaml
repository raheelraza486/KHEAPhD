paths:
  /eivital/v1.04/auth:
    post:
      summary: Authentication 
      tags:
        - Core E-invoice
      description: >-
        To authenticate with IRP
      parameters:
        - $ref: '#/components/parameters/client_id'
        - $ref: '#/components/parameters/client_secret'
        - $ref: '#/components/parameters/gstin1'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Data:
                  type: string
            examples:
              
              'Encrypted Payload':
                value: "{\r\n    \"Data\": \"\"\r\n}"
                
              'JSON corresponds to the "Data" element of Authentication Request above':
                value: >-
                   {
                      "UserName":"testuser",
                      "Password":" < Password in plain text >",
                      "AppKey":" < Randomly generated key>",
                      "ForceRefreshAccessToken": true
                   }              
       
      responses:
        '200':
          description: API Processed Successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: number
                  Data: {}
                  ErrorDetails:
                    type: array
                    items:
                      type: object
                      properties:
                        ErrorCode:
                          type: string
                        ErrorMessage:
                          type: string
                  InfoDtls: {}
              examples:
                'Success Response':
                  value: >-
                    {
                        "Status": 1,
                        "Data": {
                            "ClientId": "tv5dVs0zwwdowftRAAc50rh2ldoSx7Kg",
                            "UserName": "msharma1434",
                            "AuthToken": "XZfp13yy3aD919SeTSq+lp8f3t3v7ZXF",
                            "Sek": "/w4VK668KqmglotGyv5XlB+bQ97SEmEn8/OWc6ygRcevk/xQLlA6yFak6CtEJZqZxi+8kWX2jeX8PIF0uQucMQ==",
                            "TokenExpiry": "2022-08-24 03:07:59"
                        },
                        "ErrorDetails": null,
                        "InfoDtls": null
                    }
                    
                'Failure Response':
                  value: >-
                    {
                      "Status": 0,
                      "Data": null,
                      "ErrorDetails": [
                        {
                          "ErrorCode": "1010",
                          "ErrorMessage": "Invalid Client-ID/Client-Secret"
                        }
                      ],
                      "InfoDtls": null
                    }
                    
