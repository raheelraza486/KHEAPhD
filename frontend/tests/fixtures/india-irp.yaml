components:
  securitySchemes:
    bearerAuth:            
      type: http
      scheme: bearer
      bearerFormat: JWT  

  parameters:
    downloadType:
      name: downloadType
      in: query
      required: true
      description: Mention Download Type
      schema:
        type: string
        example: 'ERROR_CSV'
        enum: ['ERROR_CSV','JSON','CSV']
        
    ViewdownloadType:
      name: downloadType
      in: query
      required: true
      description: Mention Download Type
                  
      schema:
        type: string
        example: 'VIEW_JSON'
        enum: ['VIEW_JSON']
        
    id:
      name: id
      in: query
      required: true
      description: Id received in response of download file for Supplier and Recipient
      schema:
        type: string
        example: '622f250ea896750ee6c19b51'
        
    gstin:
      name: gstin
      in: query
      required: true
      description: User gstin
      schema:
        type: string
        example: '27BCKPS4201C1ZV'
        
    gstin1:
      name: gstin
      in: header
      required: true
      description: User gstin
      schema:
        type: string
        example: '27BCKPS4201C1ZV'
        
    gstin2:    
        name: gstin
        in: path
        description: Provide GSTIN for which OTP needs to generate
        required: true
        schema:
          type: string
          default: 33GSPMH1621G1ZH
        
        
    irn:
        name: irn
        in: path
        description: Provide IRN number
        required: true
        schema:
          type: string
          default: 11f8ef701fe294d4a14aad0b12457e62775d0fdc41a0acf05b74fbb2ddc47acb
    
    client_id:
      name: client_id
      in: header
      required: true
      description: Client id provided by IRIS
      schema:
        type: string
        example: tv5dVs0zwwdowftRAAc50rh2ldoSx7Kg    
    
    client_secret:
      name: client_secret
      in: header
      required: true
      description: Client secret provided by IRIS
      schema:
        type: string
        example: jh2qZkcOjn80A3LuyljqmTVob3hyRj0J
    
    portal_id:
      name: portal_id
      in: header
      required: true 
      description: This field is mandatory in case partner is performing action. 
      schema:
        type: string
        example: jh2qZkcOjn80A3LuyljqmTVob3hyRj0J
        
    Origin:
      name: Origin
      in: header
      required: false
      description: This field is mandatory in case partner is performing action. 
      schema:
        type: string
        example: irisirp.com 
          
    AuthToken:
      name: AuthToken
      in: header
      required: true
      description: Getting from authorization API response.
      schema:
        type: string
        example: XZfp13yy3aD919SeTSq+lp8f3t3v7ZXF
          
    user_name:
      name: user_name
      in: header
      required: true
      description: IRIS IRP username need to pass
      schema:
        type: string
        example: msharma1434
    
    sup_gstin:
      name: sup_gstin
      in: header
      required: false
      description: (Optional) Supplier GSTIN, only in case E Comm. operator is performing action.
      schema:
        type: string
        example: 27BCKPS4201C1ZV
    
    doctype:
      name: doctype
      in: query
      required: true
      description: Document type
      schema:
        type: string
        example: INV 
        enum: ["INV","CRN","DBN"]
        description: "INVOICE, CREDIT NOTE, DEBIT NOTE"
        
    docnum:
      name: docnum
      in: query
      required: true
      description: Document number
      schema:
        type: string
        example: ABCD34567
        
    docdate:
      name: docdate
      in: query
      required: true
      description: Document date
      schema:
        type: string
        example: "01/01/2022"
       
    
    otp:
      name: otp
      in: query
      required: true
      description: OTP received on register mobile number
      schema:
        type: string
        example: '442971'
        
    userId:   
      name: userId
      in: query
      schema:
        type: string
        example: user@irisbusiness.com
    
       
        
        