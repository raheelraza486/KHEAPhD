  /eivital/v1.04/heartbeat/ping:
    get:
      summary: Provides the Health status of Core APIs
      tags:
        - Core E-invoice
              
      responses:
        '200':
          description: API Processed Successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: number
                  Data: {}
                  ErrorDetails:
                    type: array
                    items:
                      type: object
                      properties:
                        ErrorCode:
                          type: string
                        ErrorMessage:
                          type: string
                  InfoDtls: {}
              examples:
                'Success Response':
                  value: >-
                   {
                      "Status": 0,
                      "Data": "Working fine",
                      "ErrorDetails": null,
                      "InfoDtls": null
                    }
   
  /eicore/v1.03/Invoice/ewb:
    post:
      summary: IRN and Ewaybill generation
      description: <h3>This API serves dual process both IRN and eway bill way generation.<br>
                    <h3>The API can be used in two ways:<br>
 
                    <h3>Generate IRN and Eway Bill Together</h3>
                    Users can utilize this feature to simultaneously generate the IRN and Eway Bill for an invoice. This is particularly useful when Eway Bill details are available.<br>
                     
                   <h3> Generate IRN First, Eway Bill Later</h3>
                    Users have the flexibility to register the invoice and obtain the IRN without generating the Eway Bill immediately. This can be beneficial when Eway Bill details are not readily available, but the invoice contains at least one item with an HSN code belonging to goods. 
      
      tags:
        - Free Add-ons
      parameters:
        - $ref: '#/components/parameters/client_id'
        - $ref: '#/components/parameters/client_secret'
        - $ref: '#/components/parameters/gstin1'
        - $ref: '#/components/parameters/user_name'
        - $ref: '#/components/parameters/AuthToken'
        - $ref: '#/components/parameters/sup_gstin'
